<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VHS Tapes</title>
  <meta name="description" content="A row of realistic VHS cassettes. Hover to browse and click to take one out.">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#28251f;font-family:Arial,Helvetica,sans-serif}#scene{width:100%;height:100svh;min-height:540px;touch-action:pan-y}canvas{display:block;width:100%;height:100%}.hint{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.04em;color:#999;white-space:nowrap}.details{position:absolute;left:70%;top:76%;max-width:230px;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}.details.visible{opacity:1;transform:translateY(0);pointer-events:auto}.details h1{font-size:17px;font-weight:500;letter-spacing:-.04em;margin:0 0 9px}.details .meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#999}.details p{font-size:12px;line-height:1.7;color:#888;margin:12px 0}.details button{padding:5px 0;border:0;background:none;color:#777;font:11px Arial;cursor:pointer;border-bottom:1px solid #ddd}.controls{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);display:flex;gap:4px}.controls button{width:8px;height:8px;overflow:hidden;padding:0;border:0;border-radius:50%;background:#dad7d1;cursor:pointer}.controls button:focus-visible{outline:2px solid #8b5a35;outline-offset:4px}.controls button[aria-pressed=true]{background:#8b5a35}.error{padding:40px;text-align:center;font-size:13px;color:#777}@media(max-width:700px){.details{left:56%;top:77%;max-width:170px}.details h1{font-size:15px}.details p{font-size:11px}.hint{bottom:22px;font-size:10px}.controls{bottom:47px}}@media(prefers-reduced-motion:reduce){.details{transition:none}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
  <main id="scene" aria-label="Interactive VHS cassette row"></main>
  <section class="details" aria-live="polite"><h1></h1><div class="meta"></div><p></p><button type="button">Return tape ↩</button></section>
  <nav class="controls" aria-label="Choose a tape"></nav>
  <div class="hint">Hover to browse · Click to take a tape</div>
  <script type="module">
    import {mountVhsSelector,library} from './vhs-selector.js';
    const panel=document.querySelector('.details');
    const nav=document.querySelector('.controls');
    let demo;
    function change(index){panel.classList.toggle('visible',index!==null);nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));if(index!==null){const t=library[index];panel.querySelector('h1').textContent=t.title;panel.querySelector('.meta').textContent=t.year+' / '+t.genre;panel.querySelector('p').textContent=t.description;}}
    library.forEach((t,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Select '+t.title);b.title=t.title;b.setAttribute('aria-pressed','false');b.onclick=()=>demo.select(i);nav.append(b)});
    try{demo=mountVhsSelector(document.querySelector('#scene'),{onSelect:change});panel.querySelector('button').onclick=()=>demo.select(null);window.addEventListener('keydown',e=>{if(e.key==='Escape')demo.select(null)});}catch(e){document.querySelector('#scene').innerHTML='<p class="error">This demo needs a browser with WebGL enabled.</p>';console.error(e)}
  </script>
</body>
</html>
